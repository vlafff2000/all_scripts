name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_pythons:
        description: 'Дополнительно 3.12 и 3.14 (информационно; на РЕД ОС 7.3 работает только 3.13)'
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.all_pythons && '["3.12","3.13","3.14"]' || '["3.13"]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (latest versions, as in the portable build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy openpyxl xlsxwriter xlrd odfpy starlette uvicorn pytest httpx
      - name: Tests on generated source files
        run: python -m pytest -q tests
