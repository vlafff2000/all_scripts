name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (latest versions, as in the portable build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy openpyxl xlsxwriter xlrd odfpy starlette uvicorn pytest httpx
      - name: Tests on generated source files
        run: python -m pytest -q tests
