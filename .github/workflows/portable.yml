name: Portable archives
# Только вручную (Actions -> Portable archives -> Run workflow) или по тегу v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows, os: windows-2022}
          - {target: linux, os: ubuntu-22.04}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable folder (own Python, no install needed)
        run: python tools/build_portable.py ${{ matrix.target }}
      - name: Run from the unpacked archive on generated source files
        run: |
          mkdir t && cd t
          python -c "import sys,zipfile,tarfile; p=sys.argv[1]; zipfile.ZipFile(p).extractall('.') if p.endswith('.zip') else tarfile.open(p).extractall('.')" ../dist/PXG_Base_portable_*
          cd PXG_Base
          PY="$PWD/python/bin/python3.13"; [ -f python/python.exe ] && PY="$PWD/python/python.exe"
          export PYTHONNOUSERSITE=1 PYTHONPATH="$PWD"
          "$PY" -s -m pxg_base.testdata.flows data
          mkdir run && cd run
          DATA="$(cd ../data && pwd)"; command -v cygpath >/dev/null && DATA="$(cygpath -m "$DATA")"
          printf '%s\n%s\n' "$DATA" 2 | "$PY" -s -m pxg_base Нулевые_расходы_и_несоответствия_часов | tail -5
          test -f 'Часы_ненулевые_расход_нулевой.xlsx'
          cd ..
          "$PY" -s -m pxg_base --server 8766 > server.log 2>&1 &
          ok=
          for i in $(seq 60); do curl -sf http://127.0.0.1:8766/api/modules > modules.json && ok=1 && break; sleep 1; done
          cat server.log
          test -n "$ok" && head -c 200 modules.json
          "$PY" -s -m gsp_maps --server 8767 > maps.log 2>&1 &
          ok=
          for i in $(seq 60); do curl -sf http://127.0.0.1:8767/api/state > state.json && ok=1 && break; sleep 1; done
          cat maps.log
          test -n "$ok" && head -c 200 state.json
          "$PY" -s -m schedule_pxg --server 8768 > sched.log 2>&1 &
          ok=
          for i in $(seq 60); do curl -sf http://127.0.0.1:8768/api/state > sched.json && ok=1 && break; sleep 1; done
          cat sched.log
          test -n "$ok" && head -c 200 sched.json
          test -f icons/skedul_pxg.ico && test -f Skedul_PXG.bat -o -f skedul_pxg.sh
          mkdir -p ../desk && "$PY" -s -m pxg_core.desktop_shortcuts --dir ../desk
          ls ../desk | grep -c . | grep -qx 6
      - uses: actions/upload-artifact@v4
        with:
          name: PXG_Base_portable_${{ matrix.target }}
          path: dist/PXG_Base_portable_*
          compression-level: 0
